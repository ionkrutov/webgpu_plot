# Example nginx server block for the webgpu-plot playground.
# Copy site/dist to /var/www/webgpu-plot and replace plot.example.com.
# WebGPU needs a secure context, so the site must be served over HTTPS (localhost is the only exception).
# Certificate: sudo certbot --nginx -d plot.example.com

server {
    listen 80;
    listen [::]:80;
    server_name plot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plot.example.com;

    ssl_certificate     /etc/letsencrypt/live/plot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plot.example.com/privkey.pem;

    root /var/www/webgpu-plot;
    index index.html;

    # The build writes .gz and .br next to every large file.
    gzip_static on;
    # brotli_static on;          # requires the ngx_brotli module

    # Files are not content-hashed: always revalidate (ETag makes this a cheap 304).
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Do not add a strict Content-Security-Policy without allowances: the runner iframe is created with
    # srcdoc (inline script) and evaluates user code, so it needs 'unsafe-inline' and 'unsafe-eval'.
    # Its isolation comes from sandbox="allow-scripts allow-downloads" (opaque origin), not from CSP.

    location / {
        try_files $uri $uri/ =404;
    }
}
